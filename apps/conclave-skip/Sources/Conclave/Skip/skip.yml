# Configuration file for https://skip.tools project
#
# Kotlin dependencies and Gradle build options for this module can be configured here
build:
  contents:
    - block: 'dependencies'
      contents:
        - 'implementation("io.socket:socket.io-client:2.1.2")'
        - 'implementation("com.mediasfu:mediasoup-client:1.0.8")'
        - 'implementation("com.google.android.gms:play-services-auth:22.0.0")'
        - 'implementation("androidx.credentials:credentials:1.6.0")'
        - 'implementation("androidx.credentials:credentials-play-services-auth:1.6.0")'
        - 'implementation("com.google.android.libraries.identity.googleid:googleid:1.2.0")'
        - 'implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")'
        - 'implementation("androidx.compose.material:material-icons-extended")'
        # dotLottie powers the branded meeting-entry takeover animation.
        - 'implementation("com.github.LottieFiles:dotlottie-android:0.16.0")'
        # Native Android bottom sheet presentation for meeting controls.
        - 'implementation("com.github.skydoves:flexible-bottomsheet-material3-android:0.3.0")'
        # CameraX powers the native pre-join camera preview.
        - 'implementation("androidx.camera:camera-core:1.6.2")'
        - 'implementation("androidx.camera:camera-camera2:1.6.2")'
        - 'implementation("androidx.camera:camera-lifecycle:1.6.2")'
        - 'implementation("androidx.camera:camera-view:1.6.2")'
        # S40 CHT-4 (Q7): Coil 3 for handwritten Compose at the SkipUI version, so chat images decode bounded to their
        # box and GIFs animate (coil-gif registers its decoder through Coil's service loader; the network fetcher
        # comes from SkipUI's coil-network-okhttp at runtime).
        - 'implementation("io.coil-kt.coil3:coil-compose:3.4.0")'
        - 'implementation("io.coil-kt.coil3:coil-gif:3.4.0")'
        # Custom Tabs for chat and assistant links on the call task (S40 Q16, S70 8 d; CHT-5 ChatLinkLauncher, SYS-8
        # NativeMeetingShare). Compatibility record: 1.10.0 is the newest version in the Gradle cache (1.9.0 also cached);
        # minSdk 23 (app floor 28), minCompileSdk 36 (app 37), minAndroidGradlePluginVersion 8.9.1 (AGP 9.2); runtime deps
        # androidx.activity 1.9.0, androidx.core 1.10.0, collection 1.4.2, concurrent-futures 1.0.0, interpolator 1.0.0,
        # guava listenablefuture 1.0, kotlin-stdlib 2.1.20 all resolve to the newer versions already on the classpath
        # (activity 1.13.0, core 1.18.0); no R8 change. One line only (HD/requests/B5-T4.md R15 lands here).
        - 'implementation("androidx.browser:browser:1.10.0")'
        # S60 C6-25 (ACT-7): androidx.webkit for the SDK app host (K/ui/apps): WebViewCompat.addWebMessageListener
        # (origin-checked messaging, no addJavascriptInterface), WebViewAssetLoader (the bundled embed at
        # https://appassets.androidplatform.net/assets/native-embed/) and WebViewFeature (run-time WEB_MESSAGE_LISTENER
        # check; absent shows the failure state). Compatibility record: 1.14.0 is the newest version in the Gradle cache
        # (1.12.1 also cached); minSdk 21 (app floor 28), minCompileSdk 34 (app 37), minAndroidGradlePluginVersion 8.1.1
        # (AGP 9.2); runtime deps androidx.annotation 1.8.1, annotation-experimental 1.4.1, androidx.core 1.1.0 and
        # org.jspecify 1.0.0 are all satisfied by cached artifacts (annotation up to 1.9.1, annotation-experimental up to
        # 1.5.1, core 1.18.0 already on the classpath, jspecify 1.0.0); no consumer R8 rules matter (R8 stays off). One
        # line only.
        - 'implementation("androidx.webkit:webkit:1.14.0")'

# this is a transpiled Skip Lite module
skip:
  mode: 'transpiled'
