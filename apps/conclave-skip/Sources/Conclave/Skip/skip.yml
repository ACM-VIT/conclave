build:
  contents:
    - block: 'dependencies'
      contents:
        - 'implementation("io.socket:socket.io-client:2.1.2") { exclude(group = "org.json", module = "json") }'
        - 'implementation("com.mediasfu:mediasoup-client:1.0.10")'
        - 'implementation("com.google.android.gms:play-services-auth:22.0.0")'
        - 'implementation("androidx.credentials:credentials:1.6.0")'
        - 'implementation("androidx.credentials:credentials-play-services-auth:1.6.0")'
        - 'implementation("com.google.android.libraries.identity.googleid:googleid:1.2.1")'
        - 'implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0")'
        - 'implementation("androidx.compose.material:material-icons-extended")'
        - 'implementation("com.github.LottieFiles:dotlottie-android:0.18.0")'
        - 'implementation("com.github.skydoves:flexible-bottomsheet-material3-android:0.4.0")'
        - 'implementation("androidx.camera:camera-core:1.7.0")'
        - 'implementation("androidx.camera:camera-camera2:1.7.0")'
        - 'implementation("androidx.camera:camera-lifecycle:1.7.0")'
        - 'implementation("androidx.camera:camera-view:1.7.0")'
        - 'implementation("io.coil-kt.coil3:coil-compose:3.4.0")'
        - 'implementation("io.coil-kt.coil3:coil-gif:3.4.0")'
        - 'implementation("androidx.media3:media3-exoplayer:1.11.1")'
        - 'implementation("androidx.browser:browser:1.10.0")'
        - 'implementation("androidx.webkit:webkit:1.18.0")'
        - 'constraints { implementation("com.google.guava:guava:33.8.0-android") }'
    - block: 'android'
      contents:
        - block: 'sourceSets'
          contents:
            - 'getByName("test").apply { kotlin.directories.map { project.file(it).resolve("resources") }.filter { it.isDirectory }.forEach { resources.srcDir(it) } }'

skip:
  mode: 'transpiled'
