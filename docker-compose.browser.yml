services:
  browser-service:
    build:
      context: .
      dockerfile: packages/shared-browser/Dockerfile
    network_mode: "host"
    volumes:
      - ${BROWSER_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      BROWSER_PROVIDER: ${BROWSER_PROVIDER:-chromium}
      BROWSER_SERVICE_PORT: ${BROWSER_SERVICE_PORT:-3040}
      NOVNC_PORT_START: ${NOVNC_PORT_START:-6080}
      NOVNC_PORT_END: ${NOVNC_PORT_END:-6100}
      BROWSER_HOST_ADDRESS: ${BROWSER_HOST_ADDRESS:-localhost}
      BROWSER_PUBLIC_BASE_URL: ${BROWSER_PUBLIC_BASE_URL:-}
      BROWSER_IMAGE_NAME: ${BROWSER_IMAGE_NAME:-conclave-browser:latest}
      BROWSER_RTP_TARGET_HOST: ${BROWSER_RTP_TARGET_HOST:-}
      BROWSER_AUDIO_TARGET_HOST: ${BROWSER_AUDIO_TARGET_HOST:-}
      BROWSER_VIDEO_TARGET_HOST: ${BROWSER_VIDEO_TARGET_HOST:-}
      SFU_HOST: ${SFU_HOST:-}
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
      CONTAINER_IDLE_TIMEOUT: ${CONTAINER_IDLE_TIMEOUT:-1800000}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_BROWSER_RUN_TOKEN: ${CLOUDFLARE_BROWSER_RUN_TOKEN:-}
      CLOUDFLARE_BROWSER_RUN_BASE_URL: ${CLOUDFLARE_BROWSER_RUN_BASE_URL:-}
      CLOUDFLARE_BROWSER_RUN_TIMEOUT_MS: ${CLOUDFLARE_BROWSER_RUN_TIMEOUT_MS:-15000}
      KITESURF_KEEP_ALIVE_MS: ${KITESURF_KEEP_ALIVE_MS:-600000}
      KITESURF_VIEWPORT_WIDTH: ${KITESURF_VIEWPORT_WIDTH:-1920}
      KITESURF_VIEWPORT_HEIGHT: ${KITESURF_VIEWPORT_HEIGHT:-1080}
    restart: unless-stopped
