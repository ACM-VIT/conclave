name: CI

"on":
  pull_request:
    branches: [staging, main]
  merge_group:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.job }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        job: [lint, typecheck, test, build, checks]
    steps:
      - run: echo "CI_JOB_STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0

      - id: setup
        uses: ./.github/actions/setup

      - id: next-cache
        if: matrix.job == 'build'
        uses: actions/cache/restore@v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-v1-${{ runner.os }}-${{ runner.arch }}-

      - id: run
        run: node scripts/ci/run.mjs ${{ matrix.job }}

      - if: always() && github.event_name == 'push' && matrix.job == 'typecheck' && steps.setup.outcome == 'success' && steps.setup.outputs.modules-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ steps.setup.outputs.modules-key }}

      - if: always() && github.event_name == 'push' && matrix.job == 'typecheck' && steps.setup.outcome == 'success' && steps.setup.outputs.modules-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.setup.outputs.store-path }}
          key: ${{ steps.setup.outputs.store-key }}

      - if: github.event_name == 'push' && matrix.job == 'build' && steps.run.outcome == 'success' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
