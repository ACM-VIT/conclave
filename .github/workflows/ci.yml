name: CI

"on":
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: check + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache the Swift comment parser
        uses: actions/cache@v4
        with:
          path: ~/.cache/conclave/swift-trivia
          key: swift-trivia-${{ runner.os }}-${{ hashFiles('scripts/quality/comments/swift-trivia/Package.resolved') }}

      - name: Check toolchains for the comment ratchet
        run: |
          swift --version
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'

      - name: Check
        run: pnpm check
        env:
          COMMENT_RATCHET_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/staging' }}
          COMMENT_RATCHET_MODE: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && 'exact' || 'merge-base' }}

      - name: Build
        run: pnpm build
