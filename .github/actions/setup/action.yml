name: Setup
description: Install the pinned toolchain and restore node_modules for the exact lockfile.

outputs:
  modules-hit:
    description: Whether node_modules came from the cache for this exact lockfile.
    value: ${{ steps.modules.outputs.cache-hit }}
  modules-key:
    description: The node_modules cache key for this lockfile.
    value: ${{ steps.modules.outputs.cache-primary-key }}
  store-path:
    description: The pnpm store directory, set only when node_modules missed.
    value: ${{ steps.store.outputs.path }}
  store-key:
    description: The pnpm store cache key for this lockfile, set only when node_modules missed.
    value: ${{ steps.store.outputs.key }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.1

    - uses: actions/setup-node@v7.1.0
      with:
        node-version: 22

    - id: toolchain
      shell: bash
      run: |
        store="$(pnpm store path --silent)"
        echo "store-path=$store" >> "$GITHUB_OUTPUT"
        echo "id=node22-pnpm$(pnpm --version)-store$(basename "$store")-$(printf '%s' "$store" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

    - id: modules
      uses: actions/cache/restore@v6.1.0
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**', '.npmrc') }}

    - id: store
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "path=${{ steps.toolchain.outputs.store-path }}" >> "$GITHUB_OUTPUT"
        echo "key=store-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.store.outputs.key }}
        restore-keys: store-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-

    - shell: bash
      run: pnpm install --frozen-lockfile
