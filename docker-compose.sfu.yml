services:
  sfu-a:
    build:
      context: .
      dockerfile: packages/sfu/Dockerfile
    network_mode: "host"
    environment:
      SFU_PORT: "3031"
      SFU_INSTANCE_ID: "sfu-a"
      SFU_PUBLIC_URL: ${SFU_A_PUBLIC_URL:-}
      SFU_REGION: ${SFU_A_REGION:-${SFU_REGION:-local}}
      SFU_SECRET: ${SFU_SECRET}
      TRANSCRIPT_WORKER_URL: ${TRANSCRIPT_WORKER_URL:-http://localhost:8788}
      SFU_DRAINING: "false"
      RTC_MIN_PORT: "40000"
      RTC_MAX_PORT: "41000"
      ANNOUNCED_IP: ${ANNOUNCED_IP}
      PLAIN_TRANSPORT_ANNOUNCED_IP: ${PLAIN_TRANSPORT_ANNOUNCED_IP:-${ANNOUNCED_IP}}
      SFU_VERSION: "v1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SFU_GAME_AI_ENABLED: ${SFU_GAME_AI_ENABLED:-}
      SFU_GAME_AI_TIMEOUT_MS: ${SFU_GAME_AI_TIMEOUT_MS:-}
      SFU_GAME_AI_WEB_SEARCH_ENABLED: ${SFU_GAME_AI_WEB_SEARCH_ENABLED:-}
      SFU_GAME_AI_WEB_SEARCH_CONTEXT_SIZE: ${SFU_GAME_AI_WEB_SEARCH_CONTEXT_SIZE:-}
      SCHEDULING_EMAIL_WORKER_URL: ${SCHEDULING_EMAIL_WORKER_URL:-}
      SCHEDULING_EMAIL_WORKER_SECRET: ${SCHEDULING_EMAIL_WORKER_SECRET:-}
      SCHEDULING_EMAIL_ENABLED: ${SCHEDULING_EMAIL_ENABLED:-}
      SCHEDULING_EMAIL_TIMEOUT_MS: ${SCHEDULING_EMAIL_TIMEOUT_MS:-}
      SCHEDULING_EMAIL_REMINDERS_ENABLED: ${SCHEDULING_EMAIL_REMINDERS_ENABLED:-}
      SCHEDULING_EMAIL_REMINDER_MINUTES: ${SCHEDULING_EMAIL_REMINDER_MINUTES:-}
      REDIS_URL: ${REDIS_URL:-}
      SFU_REDIS_URL: ${SFU_REDIS_URL:-${REDIS_URL:-}}
      SFU_REQUIRE_REDIS_ADAPTER: ${SFU_REQUIRE_REDIS_ADAPTER:-}
      SFU_BROWSER_BACKEND: ${SFU_BROWSER_BACKEND:-auto}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_BROWSER_RUN_TOKEN: ${CLOUDFLARE_BROWSER_RUN_TOKEN:-${CLOUDFLARE_API_TOKEN:-}}
      CLOUDFLARE_BROWSER_RUN_BASE_URL: ${CLOUDFLARE_BROWSER_RUN_BASE_URL:-}
      CLOUDFLARE_BROWSER_RUN_TIMEOUT_MS: ${CLOUDFLARE_BROWSER_RUN_TIMEOUT_MS:-15000}
      KITESURF_KEEP_ALIVE_MS: ${KITESURF_KEEP_ALIVE_MS:-600000}
      KITESURF_VIEWPORT_WIDTH: ${KITESURF_VIEWPORT_WIDTH:-1920}
      KITESURF_VIEWPORT_HEIGHT: ${KITESURF_VIEWPORT_HEIGHT:-1080}
      KITESURF_IDLE_TIMEOUT_MS: ${KITESURF_IDLE_TIMEOUT_MS:-1800000}
      BROWSER_SERVICE_URL: ${BROWSER_SERVICE_URL:-http://localhost:3040}
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
      BROWSER_SERVICE_TIMEOUT_MS: ${BROWSER_SERVICE_TIMEOUT_MS:-5000}
      RECORDING_STORAGE_PATH: ${RECORDING_STORAGE_PATH:-/var/lib/conclave/recordings}
      CONCLAVE_SQLITE_PATH: ${CONCLAVE_SQLITE_PATH:-/var/lib/conclave/recordings/conclave.sqlite}
    volumes:
      - ${RECORDING_STORAGE_PATH:-/var/lib/conclave/recordings}:/var/lib/conclave/recordings
    restart: unless-stopped

  sfu-b:
    build:
      context: .
      dockerfile: packages/sfu/Dockerfile
    network_mode: "host"
    environment:
      SFU_PORT: "3032"
      SFU_INSTANCE_ID: "sfu-b"
      SFU_PUBLIC_URL: ${SFU_B_PUBLIC_URL:-}
      SFU_REGION: ${SFU_B_REGION:-${SFU_REGION:-local}}
      SFU_SECRET: ${SFU_SECRET}
      TRANSCRIPT_WORKER_URL: ${TRANSCRIPT_WORKER_URL:-http://localhost:8788}
      SFU_DRAINING: "false"
      RTC_MIN_PORT: "41001"
      RTC_MAX_PORT: "42000"
      ANNOUNCED_IP: ${ANNOUNCED_IP}
      PLAIN_TRANSPORT_ANNOUNCED_IP: ${PLAIN_TRANSPORT_ANNOUNCED_IP:-${ANNOUNCED_IP}}
      SFU_VERSION: "v2"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SFU_GAME_AI_ENABLED: ${SFU_GAME_AI_ENABLED:-}
      SFU_GAME_AI_TIMEOUT_MS: ${SFU_GAME_AI_TIMEOUT_MS:-}
      SFU_GAME_AI_WEB_SEARCH_ENABLED: ${SFU_GAME_AI_WEB_SEARCH_ENABLED:-}
      SFU_GAME_AI_WEB_SEARCH_CONTEXT_SIZE: ${SFU_GAME_AI_WEB_SEARCH_CONTEXT_SIZE:-}
      SCHEDULING_EMAIL_WORKER_URL: ${SCHEDULING_EMAIL_WORKER_URL:-}
      SCHEDULING_EMAIL_WORKER_SECRET: ${SCHEDULING_EMAIL_WORKER_SECRET:-}
      SCHEDULING_EMAIL_ENABLED: ${SCHEDULING_EMAIL_ENABLED:-}
      SCHEDULING_EMAIL_TIMEOUT_MS: ${SCHEDULING_EMAIL_TIMEOUT_MS:-}
      SCHEDULING_EMAIL_REMINDERS_ENABLED: ${SCHEDULING_EMAIL_REMINDERS_ENABLED:-}
      SCHEDULING_EMAIL_REMINDER_MINUTES: ${SCHEDULING_EMAIL_REMINDER_MINUTES:-}
      REDIS_URL: ${REDIS_URL:-}
      SFU_REDIS_URL: ${SFU_REDIS_URL:-${REDIS_URL:-}}
      SFU_REQUIRE_REDIS_ADAPTER: ${SFU_REQUIRE_REDIS_ADAPTER:-}
      SFU_BROWSER_BACKEND: ${SFU_BROWSER_BACKEND:-auto}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_BROWSER_RUN_TOKEN: ${CLOUDFLARE_BROWSER_RUN_TOKEN:-${CLOUDFLARE_API_TOKEN:-}}
      CLOUDFLARE_BROWSER_RUN_BASE_URL: ${CLOUDFLARE_BROWSER_RUN_BASE_URL:-}
      CLOUDFLARE_BROWSER_RUN_TIMEOUT_MS: ${CLOUDFLARE_BROWSER_RUN_TIMEOUT_MS:-15000}
      KITESURF_KEEP_ALIVE_MS: ${KITESURF_KEEP_ALIVE_MS:-600000}
      KITESURF_VIEWPORT_WIDTH: ${KITESURF_VIEWPORT_WIDTH:-1920}
      KITESURF_VIEWPORT_HEIGHT: ${KITESURF_VIEWPORT_HEIGHT:-1080}
      KITESURF_IDLE_TIMEOUT_MS: ${KITESURF_IDLE_TIMEOUT_MS:-1800000}
      BROWSER_SERVICE_URL: ${BROWSER_SERVICE_URL:-http://localhost:3040}
      BROWSER_SERVICE_TOKEN: ${BROWSER_SERVICE_TOKEN:-}
      BROWSER_SERVICE_TIMEOUT_MS: ${BROWSER_SERVICE_TIMEOUT_MS:-5000}
      RECORDING_STORAGE_PATH: ${RECORDING_STORAGE_PATH:-/var/lib/conclave/recordings}
      CONCLAVE_SQLITE_PATH: ${CONCLAVE_SQLITE_PATH:-/var/lib/conclave/recordings/conclave.sqlite}
    volumes:
      - ${RECORDING_STORAGE_PATH:-/var/lib/conclave/recordings}:/var/lib/conclave/recordings
    restart: unless-stopped
