packages:
  - "apps/*"
  - "!apps/mobile"
  - "packages/*"
# The bundler aliases and deployment scripts use the shared node_modules tree.
nodeLinker: hoisted
# Keep security fixes available when upstream packages retain older ranges.
# mediasoup-client and yjs must resolve to one version across the workspace.
overrides:
  "@node-minify/core>glob": "13.0.6"
  "esbuild@>=0.27.3 <0.28.2": "0.28.2"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "socket.io-parser@>=4.0.0 <4.2.7": "4.2.7"
  protobufjs: "8.8.1"
  mediasoup-client: "3.24.5"
  yjs: "13.6.33"
allowBuilds:
  core-js: true
  cpu-features: true
  esbuild: true
  mediasoup: true
  protobufjs: true
  sharp: true
  ssh2: true
  workerd: true
minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.8"
  - "@better-auth/drizzle-adapter@1.7.8"
  - "@better-auth/kysely-adapter@1.7.8"
  - "@better-auth/memory-adapter@1.7.8"
  - "@better-auth/mongo-adapter@1.7.8"
  - "@better-auth/prisma-adapter@1.7.8"
  - "@better-auth/telemetry@1.7.8"
  - "@cloudflare/workers-types@5.20261014.1"
  - "@next/env@16.4.1"
  - "@next/swc-darwin-arm64@16.4.1"
  - "@next/swc-darwin-x64@16.4.1"
  - "@next/swc-linux-arm64-gnu@16.4.1"
  - "@next/swc-linux-arm64-musl@16.4.1"
  - "@next/swc-linux-x64-gnu@16.4.1"
  - "@next/swc-linux-x64-musl@16.4.1"
  - "@next/swc-win32-arm64-msvc@16.4.1"
  - "@next/swc-win32-x64-msvc@16.4.1"
  - "@posthog/core@1.59.0"
  - "@posthog/types@1.416.0"
  - "@puppeteer/browsers@3.2.5"
  - better-auth@1.7.8
  - dotenv@18.0.8
  - lucide-react@1.57.0
  - miniflare@5.20261012.0-beta
  - next@16.4.1
  - openai@7.33.0
  - posthog-node@5.56.1
  - puppeteer-core@25.14.0
  - react-dom@19.3.1
  - react@19.3.1
  - wrangler@4.151.0
patchedDependencies:
  '@mediapipe/tasks-vision@1.1.0': patches/@mediapipe__tasks-vision@1.1.0.patch
