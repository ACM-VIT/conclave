packages:
  - "apps/*"
  - "!apps/mobile"
  - "packages/*"
# The bundler aliases and deployment scripts use the shared node_modules tree.
nodeLinker: hoisted
# Keep security fixes available when upstream packages retain older ranges.
# mediasoup-client and yjs must resolve to one version across the workspace.
overrides:
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "socket.io-parser@>=4.0.0 <4.2.7": "4.2.7"
  protobufjs: "8.8.0"
  mediasoup-client: "3.23.2"
  yjs: "13.6.32"
allowBuilds:
  core-js: true
  cpu-features: true
  esbuild: true
  mediasoup: true
  protobufjs: true
  sharp: true
  ssh2: true
  workerd: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - lucide-react@1.45.0
  - miniflare@5.20260911.0-alpha
  - next@16.3.5
  - wrangler@4.131.1
